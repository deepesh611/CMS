services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /data
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/backups:/data/backups
      - ./data/db:/data/db
    depends_on:
      - db
    restart: unless-stopped

  # Postgres — used when DATABASE_URL points here. Free & open source.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # MinIO — free, self-hosted, S3-compatible object storage.
  # Only needed when STORAGE_BACKEND=minio.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
