{% extends "base.html" %}
{% block title %}Roles{% endblock %}
{% block page_title %}Roles &amp; Permissions{% endblock %}

{% block content %}
<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>Role</th><th>Description</th><th>Permissions</th><th></th></tr>
      </thead>
      <tbody>
        {% for r in roles %}
        <tr>
          <td>{{ r.name }}</td>
          <td class="text-muted">{{ r.description or '' }}</td>
          <td><span class="badge bg-secondary">{{ r.role_permissions|length }}</span></td>
          <td><a href="{{ url_for('admin.role_permissions', role_id=r.id) }}" class="btn btn-sm btn-outline-primary">Configure</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
