{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block page_title %}Reports &amp; Dashboards{% endblock %}
{% block content %}
<div class="row g-3">
  {% for key, label in reports.items() %}
  <div class="col-md-4">
    <div class="card">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div><i class="bi bi-file-earmark-bar-graph"></i> {{ label }} Report</div>
        <a href="{{ url_for('reports.view', report_key=key) }}" class="btn btn-sm btn-outline-primary">Open</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
